services:
  # ── Backend API + Socket.IO ──
  - type: web
    name: snapbid-server
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_NAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_SECRET_API
        sync: false

  # ── Frontend (Next.js) ──
  - type: web
    name: snapbid-client
    runtime: node
    region: singapore
    rootDir: client
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_TINY_MCE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
        sync: false
      - key: NEXT_PUBLIC_RECAPTCHA_SECRET_KEY
        sync: false
